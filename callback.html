<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="logo.png" type="image/png">
  <title>Connecting Discord | JBA</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var err = params.get("error");
      if (err === "consent_required" || err === "login_required" || err === "interaction_required" || (err && params.get("state") === "silent")) {
        location.replace("/?silent=1");
      }
    })();
  </script>
</head>
<body class="page-start">
  <section class="hero">
    <div class="hero-content">
      <h1 id="title">Connecting Discord</h1>
      <p id="status">Finishing login…</p>
      <div class="hero-actions" id="actions" hidden>
        <a class="cta-btn" id="join-link" href="https://discord.gg/36FHef566k" target="_blank" rel="noopener">Join Server</a>
        <button type="button" class="cta-btn" id="retry-btn">Try Again</button>
      </div>
    </div>
  </section>
  <script src="discord-config.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const code = params.get("code");
    const err = params.get("error");
    const title = document.getElementById("title");
    const status = document.getElementById("status");
    const actions = document.getElementById("actions");

    function tellOpener(message) {
      try {
        const channel = new BroadcastChannel("jba-discord");
        channel.postMessage(message);
        channel.close();
      } catch (err) {}
      if (window.opener) {
        window.opener.postMessage(message, location.origin);
      }
    }

    function finish(user) {
      var account = {
        id: user.id,
        username: user.username,
        name: user.name,
        avatar: user.avatar || "",
        serverChecked: true,
        checkedAt: Date.now()
      };
      function saveSession(session) {
        try {
          localStorage.setItem("jba-session", JSON.stringify(session));
          localStorage.setItem("jba-discord", JSON.stringify(session));
          localStorage.setItem("jba-login-profile", JSON.stringify({
            roblox: session.roblox || "",
            build: session.build || "",
            notPlayer: !!session.notPlayer
          }));
          localStorage.removeItem("jba-discord-status");
          var payload = btoa(unescape(encodeURIComponent(JSON.stringify(session))));
          document.cookie = "jba_user=" + encodeURIComponent(payload) + "; Path=/; Max-Age=604800; SameSite=Lax";
        } catch (err) {}
      }
      fetch("/api/signins").then(function (res) { return res.json(); }).then(function (data) {
        var found = (data.players || []).find(function (player) { return String(player.id) === String(account.id); });
        if (found && ((found.roblox && found.build) || found.notPlayer)) {
          var session = {
            id: String(account.id),
            username: found.username || account.username || "",
            name: found.name || account.name || account.username || "",
            avatar: account.avatar || found.avatar || "",
            roblox: found.roblox || "",
            build: found.build || "",
            notPlayer: !!found.notPlayer,
            serverChecked: true,
            connectedAt: Date.now()
          };
          saveSession(session);
          tellOpener({ type: "jba-discord", user: session });
          location.replace("/home.html");
          return;
        }
        try { localStorage.setItem("jba-discord", JSON.stringify(account)); } catch (err) {}
        tellOpener({ type: "jba-discord", user: account });
        location.replace(location.origin + "/?connected=1#" + encodeURIComponent(JSON.stringify(account)));
      }).catch(function () {
        try { localStorage.setItem("jba-discord", JSON.stringify(account)); } catch (err) {}
        tellOpener({ type: "jba-discord", user: account });
        location.replace(location.origin + "/?connected=1#" + encodeURIComponent(JSON.stringify(account)));
      });
    }

    function requireJoin(invite) {
      const link = invite || "https://discord.gg/36FHef566k";
      title.textContent = "Join the server";
      status.textContent = "You have to join the JBA Discord before login can finish.";
      document.getElementById("join-link").href = link;
      actions.hidden = false;
      const statusInfo = { needsJoin: true, invite: link };
      localStorage.setItem("jba-discord-status", JSON.stringify(statusInfo));
      tellOpener({ type: "jba-discord-status", status: statusInfo });
    }

    document.getElementById("retry-btn").addEventListener("click", function () {
      const cfg = window.JBA_DISCORD || {};
      if (!cfg.clientId) return;
      const url = new URL("https://discord.com/oauth2/authorize");
      url.searchParams.set("client_id", cfg.clientId);
      url.searchParams.set("response_type", "code");
      url.searchParams.set("scope", "identify guilds");
      url.searchParams.set("redirect_uri", cfg.redirectUri);
      location.href = url.toString();
    });

    if (err || !code) {
      title.textContent = "Login cancelled";
      status.textContent = "Discord login was cancelled.";
      actions.hidden = false;
      document.getElementById("join-link").hidden = true;
    } else if (sessionStorage.getItem("jba-oauth-code") === code) {
      var saved = null;
      try { saved = JSON.parse(localStorage.getItem("jba-discord") || "null"); } catch (err) {}
      if (saved && (saved.username || saved.name)) {
        location.replace(location.origin + "/?connected=1#" + encodeURIComponent(JSON.stringify(saved)));
      } else {
        title.textContent = "Login failed";
        status.textContent = "That Discord login was already used. Go back and click Connect Discord again.";
        actions.hidden = false;
        document.getElementById("join-link").hidden = true;
      }
    } else {
      sessionStorage.setItem("jba-oauth-code", code);
      fetch("/api/discord?code=" + encodeURIComponent(code))
        .then(function (res) {
          return res.json().then(function (data) { return { ok: res.ok, data: data }; });
        })
        .then(function (result) {
          if (!result.ok) throw new Error(result.data.error || "Discord login failed");
          if (result.data.needsJoin) {
            requireJoin(result.data.invite);
            return;
          }
          finish(result.data);
        })
        .catch(function (error) {
          const message = error.message || "Discord login could not be completed.";
          title.textContent = "Login failed";
          status.textContent = message;
          actions.hidden = false;
          document.getElementById("join-link").hidden = true;
          const statusInfo = { error: message };
          localStorage.setItem("jba-discord-status", JSON.stringify(statusInfo));
          tellOpener({ type: "jba-discord-status", status: statusInfo });
        });
    }
  </script>
</body>
</html>
