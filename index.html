<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Junior Basketball Association | JBA</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      function signedIn(user) {
        return !!(user && user.serverChecked && (user.username || user.name));
      }
      try {
        var saved = JSON.parse(localStorage.getItem("jba-discord") || "null");
        if (signedIn(saved)) {
          location.replace("home.html");
          return;
        }
      } catch (err) {}
      var match = document.cookie.match(/(?:^|; )jba_user=([^;]+)/);
      if (!match) return;
      try {
        var user = JSON.parse(atob(decodeURIComponent(match[1])));
        if (signedIn(user)) location.replace("home.html");
      } catch (err) {}
    })();
  </script>
</head>
<body class="page-start">
  <section id="home" class="hero">
    <div class="hero-content">
      <img src="logo.png" alt="JBA" class="hero-logo">
      <h1 class="league-title">Junior Basketball Association</h1>
      <div class="hero-actions">
        <button type="button" class="cta-btn" id="login-btn">Login</button>
        <a href="home.html" class="cta-btn">View League</a>
      </div>
      <p class="login-note" id="login-note" hidden></p>
    </div>
    <div class="hero-credit">
      <p>&copy; 2026 Junior Basketball Association.</p>
      <p>Practical Basketball</p>
    </div>
  </section>

  <script src="discord-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
